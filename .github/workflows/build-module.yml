name: Build IMS Module
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate sdkmanager
        id: sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -1)
          echo "Found: $SDKMANAGER"
          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Put full custom android.jar into app/libs (KHÔNG xóa gì khỏi file này)
        run: |
          mkdir -p PhhIms/app/libs
          curl -L -o PhhIms/app/libs/android.jar "https://github.com/quandzvl12/ims-module-infinity-a21s/releases/download/andrjarv1/android.jar"

      - name: Strip MmTelFeature stub from the SDK's OWN compileSdk android.jar
        run: |
          yes | "${{ steps.sdk.outputs.path }}" --licenses > /dev/null 2>&1 || true
          "${{ steps.sdk.outputs.path }}" --install "platforms;android-34" "platforms;android-33" > /dev/null
          for f in "$ANDROID_HOME"/platforms/android-34/android.jar "$ANDROID_HOME"/platforms/android-33/android.jar; do
            if [ -f "$f" ]; then
              zip -d "$f" \
                android/telephony/ims/feature/MmTelFeature.class \
                'android/telephony/ims/feature/MmTelFeature$MmTelCapabilities.class' || true
            fi
          done

      - name: Build PhhIms APK
        working-directory: PhhIms
        run: ./gradlew assembleRelease

      - name: Set up build-tools for aapt2
        run: |
          "${{ steps.sdk.outputs.path }}" --install "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Build overlay APKs
        run: |
          aapt2 compile --dir overlay-framework/res -o overlay-framework/compiled.zip
          aapt2 link -o overlay-framework.apk \
            --manifest overlay-framework/AndroidManifest.xml \
            -I "$ANDROID_HOME/platforms/android-34/android.jar" \
            overlay-framework/compiled.zip

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > module.jks

      - name: Sign APKs
        run: |
          apksigner sign --ks module.jks --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} --key-pass pass:${{ secrets.KEY_PASS }} \
            PhhIms/app/build/outputs/apk/release/app-release-unsigned.apk
          apksigner sign --ks module.jks --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} --key-pass pass:${{ secrets.KEY_PASS }} \
            overlay-framework.apk

      - name: Assemble KSU module zip
        run: |
          mkdir -p out/system/priv-app/PhhIms out/system/product/overlay
          cp PhhIms/app/build/outputs/apk/release/*.apk out/system/priv-app/PhhIms/PhhIms.apk
          cp overlay-framework.apk out/system/product/overlay/
          cp -r module-template/* out/
          cd out && zip -r ../ims-module.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ims-module
          path: ims-module.zip
