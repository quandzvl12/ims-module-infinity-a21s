name: Build android.jar from ROM
on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Link tải trực tiếp ROM zip'
        required: true

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Download ROM
        run: curl -L -o "$GITHUB_WORKSPACE/rom.zip" "${{ github.event.inputs.rom_url }}"

      - name: Unzip ROM
        run: unzip -o "$GITHUB_WORKSPACE/rom.zip" -d "$GITHUB_WORKSPACE/rom_extracted"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli default-jdk
          curl -L -o "$GITHUB_WORKSPACE/sdat2img.py" https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
          curl -L -o "$GITHUB_WORKSPACE/dex-tools.zip" https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip "$GITHUB_WORKSPACE/dex-tools.zip" -d "$GITHUB_WORKSPACE/dex2jar"

      - name: Decompress and rebuild system.img
        run: |
          cd "$GITHUB_WORKSPACE/rom_extracted"
          brotli -d system.new.dat.br -o system.new.dat
          python3 "$GITHUB_WORKSPACE/sdat2img.py" system.transfer.list system.new.dat system.img

      - name: Mount system.img, collect framework jars + telephonycore apex
        run: |
          cd "$GITHUB_WORKSPACE/rom_extracted"
          mkdir -p system_mount jars_out
          sudo mount -o loop,ro system.img system_mount
          FW_DIR=$(find system_mount -type d -name framework | head -1)
          cp "$FW_DIR"/framework.jar "$FW_DIR"/services.jar \
             "$FW_DIR"/telephony-common.jar "$FW_DIR"/ims-common.jar \
             jars_out/ 2>/dev/null || true
          sudo cp system_mount/system/apex/com.android.telephonycore.capex ./telephonycore.capex
          sudo umount system_mount

      - name: Unpack telephonycore capex and pull framework-telephony.jar
        run: |
          WORKDIR="$GITHUB_WORKSPACE/rom_extracted"
          mkdir -p "$WORKDIR/capex_unpack" "$WORKDIR/apex_unpack" "$WORKDIR/payload_mount"

          unzip -o "$WORKDIR/telephonycore.capex" -d "$WORKDIR/capex_unpack"
          unzip -o "$WORKDIR/capex_unpack/original_apex" -d "$WORKDIR/apex_unpack"

          sudo mount -o loop,ro "$WORKDIR/apex_unpack/apex_payload.img" "$WORKDIR/payload_mount"
          sudo cp "$WORKDIR/payload_mount/javalib/framework-telephony.jar" "$WORKDIR/jars_out/"
          sudo umount "$WORKDIR/payload_mount"

          ls -la "$WORKDIR/jars_out/"

      - name: Convert each jar (dex) to classes.jar
        run: |
          cd "$GITHUB_WORKSPACE/rom_extracted/jars_out"
          for f in *.jar; do
            name="${f%.jar}"
            unzip -o "$f" classes.dex -d "$name" 2>/dev/null || continue
            bash "$GITHUB_WORKSPACE"/dex2jar/*/d2j-dex2jar.sh "$name/classes.dex" -o "$name-src.jar" --force
          done
          ls -la

      - name: Merge all into one android.jar
        run: |
          JARS_DIR="$GITHUB_WORKSPACE/rom_extracted/jars_out"
          mkdir -p "$JARS_DIR/merged"
          cd "$JARS_DIR"
          for f in *-src.jar; do
            unzip -o -q "$f" -d merged
          done
          cd merged
          zip -r -q "$GITHUB_WORKSPACE/rom_extracted/android.jar" .
          ls -la "$GITHUB_WORKSPACE/rom_extracted/android.jar"

      - name: Verify MmTelFeature is present
        run: |
          unzip -l "$GITHUB_WORKSPACE/rom_extracted/android.jar" | grep -i "android/telephony/ims/feature/MmTelFeature" || echo "STILL NOT FOUND"

      - uses: actions/upload-artifact@v4
        with:
          name: android-jar-output
          path: rom_extracted/android.jar
