name: Locate MmTelFeature class
on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Link tải trực tiếp ROM zip'
        required: true
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Download ROM
        run: curl -L -o rom.zip "${{ github.event.inputs.rom_url }}"
      - name: Unzip ROM
        run: unzip -o rom.zip -d rom_extracted
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli
          curl -L -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
      - name: Rebuild system.img
        run: |
          cd rom_extracted
          brotli -d system.new.dat.br -o system.new.dat
          python3 ../sdat2img.py system.transfer.list system.new.dat system.img
      - name: Mount and search every jar/apex/apk for the class
        run: |
          cd rom_extracted
          mkdir -p system_mount
          sudo mount -o loop,ro system.img system_mount
          echo "=== All .jar/.apk/.apex files under system ===" > ../scan_result.txt
          sudo find system_mount -type f \( -iname "*.jar" -o -iname "*.apk" -o -iname "*.apex" -o -iname "*.capex" \) 2>/dev/null >> ../scan_result.txt || true
          echo "" >> ../scan_result.txt
          echo "=== Files that CONTAIN MmTelFeature.class ===" >> ../scan_result.txt
          sudo find system_mount -type f \( -iname "*.jar" -o -iname "*.apk" -o -iname "*.apex" -o -iname "*.capex" \) 2>/dev/null | while read f; do
            if sudo unzip -l "$f" 2>/dev/null | grep -qi "MmTelFeature.class"; then
              echo "FOUND IN: $f" | sudo tee -a ../scan_result.txt > /dev/null
            fi
          done
          sudo umount system_mount
      - uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: scan_result.txt
