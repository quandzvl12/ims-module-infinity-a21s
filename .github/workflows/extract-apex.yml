name: Extract telephonycore apex
on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Link tải trực tiếp ROM zip'
        required: true
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download ROM
        run: curl -L -o rom.zip "${{ github.event.inputs.rom_url }}"

      - name: Unzip ROM
        run: unzip -o rom.zip -d rom_extracted

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli
          curl -L -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py

      - name: Rebuild system.img
        run: |
          cd rom_extracted
          brotli -d system.new.dat.br -o system.new.dat
          python3 ../sdat2img.py system.transfer.list system.new.dat system.img

      - name: Mount system.img and pull the capex file out
        run: |
          cd rom_extracted
          mkdir -p system_mount
          sudo mount -o loop,ro system.img system_mount
          sudo cp system_mount/system/apex/com.android.telephonycore.capex ../telephonycore.capex
          sudo umount system_mount

      - name: Unpack capex -> apex -> payload -> search
        run: |
          mkdir -p capex_unpack
          cd capex_unpack
          unzip -o ../telephonycore.capex
          mkdir -p apex_unpack
          cd apex_unpack
          unzip -o ../original_apex
          mkdir -p payload_mount
          sudo mount -o loop,ro apex_payload.img payload_mount
          sudo find payload_mount -type f 2>/dev/null | tee ../../jar_list.txt
          echo "--- searching for MmTelFeature.class ---" | tee ../../result.txt
          sudo find payload_mount -type f \( -iname "*.jar" -o -iname "*.apk" \) 2>/dev/null | while read f; do
            if sudo unzip -l "$f" 2>/dev/null | grep -qi "MmTelFeature.class"; then
              echo "FOUND IN: $f" | tee -a ../../result.txt
            fi
          done
          sudo umount payload_mount

      - uses: actions/upload-artifact@v4
        with:
          name: apex-result
          path: |
            jar_list.txt
            result.txt
