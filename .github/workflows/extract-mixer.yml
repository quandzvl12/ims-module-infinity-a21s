name: Extract Mixer Paths
on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Link tải trực tiếp ROM zip'
        required: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download ROM
        run: curl -L -o rom.zip "${{ github.event.inputs.rom_url }}"

      - name: Unzip ROM
        run: unzip -o rom.zip -d rom_extracted

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli e2tools
          curl -L -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py

      - name: Decompress and rebuild vendor.img
        run: |
          cd rom_extracted
          if [ -f vendor.new.dat.br ]; then
            brotli -d vendor.new.dat.br -o vendor.new.dat
            python3 ../sdat2img.py vendor.transfer.list vendor.new.dat vendor.img
          fi

      - name: Decompress and rebuild system.img (phòng khi mixer nằm bên system)
        run: |
          cd rom_extracted
          if [ -f system.new.dat.br ]; then
            brotli -d system.new.dat.br -o system.new.dat
            python3 ../sdat2img.py system.transfer.list system.new.dat system.img
          fi

      - name: List contents of vendor.img
        run: |
          cd rom_extracted
          if [ -f vendor.img ]; then
            e2ls -R vendor.img:/ > vendor_filelist.txt || true
          fi

      - name: Locate mixer_paths.xml
        run: |
          cd rom_extracted
          grep -i "mixer_paths" vendor_filelist.txt || echo "Not found in vendor_filelist.txt, listing all:" 
          cat vendor_filelist.txt | tee found_files.txt

      - name: Extract mixer_paths.xml file itself
        run: |
          cd rom_extracted
          MIXER_PATH=$(grep -i "mixer_paths" vendor_filelist.txt | head -1 | awk '{print $NF}')
          if [ -n "$MIXER_PATH" ];
