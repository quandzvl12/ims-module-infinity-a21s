name: Extract Mixer Paths
on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Link tải trực tiếp ROM zip'
        required: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download ROM
        run: curl -L -o rom.zip "${{ github.event.inputs.rom_url }}"

      - name: Unzip ROM
        run: unzip -o rom.zip -d rom_extracted

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli
          curl -L -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py

      - name: Decompress and rebuild vendor.img
        run: |
          cd rom_extracted
          if [ -f vendor.new.dat.br ]; then
            brotli -d vendor.new.dat.br -o vendor.new.dat
            python3 ../sdat2img.py vendor.transfer.list vendor.new.dat vendor.img
          fi

      - name: Mount vendor.img and search
        run: |
          cd rom_extracted
          mkdir -p vendor_mount
          sudo mount -o loop,ro vendor.img vendor_mount
          find vendor_mount -iname "*mixer_paths*" | tee ../found_files.txt
          find vendor_mount -iname "*mixer_paths*" -exec cp {} ../ \;
          sudo umount vendor_mount

      - uses: actions/upload-artifact@v4
        with:
          name: mixer-search-result
          path: |
            found_files.txt
            *.xml
